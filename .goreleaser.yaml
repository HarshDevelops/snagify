version: 2

project_name: snagify

before:
  hooks:
    - go mod tidy

builds:
  - id: snagify
    main: .
    binary: snagify
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: snagify
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Docker images are built in their own GitHub Actions job (.github/workflows/release.yml#docker)
# rather than via this goreleaser block. Reason: goreleaser 2.x's `dockers:` block requires a
# Dockerfile that builds from source inside BuildKit, but snagify's Dockerfile distroless base
# has no Go toolchain — the binary has to be produced by goreleaser first and COPY'd in.
# Doing both in one job meant goreleaser's build context lacked go.sum (the source-only context
# is the issue), so we split the pipeline: goreleaser produces dist/, then the docker job
# extracts dist/snagify_Linux_x86_64.tar.gz and COPY's the binary into the image.
# See https://github.com/HarshDevelops/snagify/blob/main/.github/workflows/release.yml

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "Snagify {{ .Version }}"
