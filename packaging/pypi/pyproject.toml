[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snagify"
version = "0.4.1"
description = "CLI to debug works-on-my-machine issues by detecting environment drift."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Harsh Srivastava" }]
keywords = ["works-on-my-machine", "environment-drift", "devtools", "cli", "docker", "dotenv"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration"
]

[project.urls]
Homepage = "https://github.com/HarshDevelops/snagify"
Repository = "https://github.com/HarshDevelops/snagify"
Issues = "https://github.com/HarshDevelops/snagify/issues"

[project.scripts]
snagify = "snagify_wrapper.__main__:main"
