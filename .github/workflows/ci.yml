name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: smoke (unix)
        if: runner.os != 'Windows'
        run: |
          go build -o ./snagify .
          ./snagify --version
          ./snagify init --help
          ./snagify check --help

      - name: smoke (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o ./snagify.exe .
          ./snagify.exe --version
