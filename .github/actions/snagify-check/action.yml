name: 'snagify check'
description: 'Run snagify check against the repo to surface environment drift blockers as a CI gate.'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  version:
    description: 'Snagify release tag to install (e.g. v0.5.0). Use "latest" to resolve the most recent.'
    required: false
    default: 'latest'
  config:
    description: 'Path to .snagify.yaml (relative to repo root).'
    required: false
    default: '.snagify.yaml'
  fail_on_blocker:
    description: 'Exit non-zero when snagify check reports a critical blocker.'
    required: false
    default: 'true'
  args:
    description: 'Extra arguments to forward to `snagify check` (e.g. --no-tls --timeout 5s).'
    required: false
    default: ''
  workdir:
    description: 'Working directory to run snagify in (defaults to the runner workspace).'
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL_ON_BLOCKER: ${{ inputs.fail_on_blocker }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
      run: ${{ github.action_path }}/entry.sh

    - if: ${{ steps.setup.outcome == 'success' && inputs.fail_on_blocker == 'true' }}
      id: gate
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
      run: snagify check --config "$INPUT_CONFIG" $INPUT_ARGS
